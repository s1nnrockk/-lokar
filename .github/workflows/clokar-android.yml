name: Clokar Android build
on:
  push:
    branches: [rewrite-csharp-maui]
  pull_request:
    branches: [rewrite-csharp-maui]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Restore
        run: dotnet restore TalkClock.Maui/TalkClock.Maui.csproj -p:TargetFramework=net10.0-android
      - name: Build Android Release
        run: dotnet build TalkClock.Maui/TalkClock.Maui.csproj -c Release -f net10.0-android --no-restore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: clokar-android-release
          path: TalkClock.Maui/bin/Release/net10.0-android/*.apk
          if-no-files-found: error
